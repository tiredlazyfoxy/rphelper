# RPHelper dev-compose nginx — server-level config, mounted as /etc/nginx/conf.d/default.conf.
# Directive values and reasons: docs/architecture/deployment.md.
# Identical to docker/nginx.conf except for exactly two things: the /api/ upstream is
# the host uvicorn (host.docker.internal:8184), and the catch-all falls back to
# /app/index.html, because the local frontend/dist has no root index.html.

# Path-only access log: $uri, never the query string (FEAT-019 redaction rule).
log_format rphelper_path '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
error_log /dev/stderr;

server {
    access_log /dev/stdout rphelper_path;

    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location /bootstrap/ { try_files $uri $uri/ /bootstrap/index.html; }
    location /login/     { try_files $uri $uri/ /login/index.html; }
    location /admin/     { try_files $uri $uri/ /admin/index.html; }

    location = /bootstrap { return 302 /bootstrap/; }
    location = /login     { return 302 /login/; }
    location = /admin     { return 302 /admin/; }

    location / { try_files $uri /app/index.html; }

    location ^~ /api/ {
        proxy_pass              http://host.docker.internal:8184/api/;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;

        # --- streaming (SSE) ---
        proxy_http_version      1.1;
        proxy_set_header        Connection '';
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      300s;

        client_max_body_size    64m;
    }

    location ~* \.(js|css|woff2?|png|svg|jpg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
