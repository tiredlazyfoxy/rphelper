[project]
name = "rphelper-backend"
version = "0.1.0"
description = "RPHelper backend — FastAPI application, SQLite store"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "loguru>=0.7,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "sqlite-vec==0.1.9",
    "argon2-cffi>=23.1,<26.0",
    "httpx>=0.27,<1.0",
    "alembic>=1.14,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "mypy>=1.13,<2.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
